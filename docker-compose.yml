# CODCompta in production: docker compose up -d --build
#
#   web        Nginx, reachable only from the server itself on 127.0.0.1:${APP_PORT}
#              (the server's existing reverse proxy adds HTTPS in front of it)
#   app        Laravel on php-fpm; runs the database migrations at start
#   queue      background jobs: reading agency messages, reading Google Sheets
#   scheduler  scheduled tasks: Google Sheets re-read every morning at 6:00
#   db         MySQL 8.4, data kept in the "mysql-data" volume
#
# Every setting comes from the .env file next to this one (see deploy/production.env.example).

x-laravel: &laravel
  build:
    context: .
    target: app
  image: codcompta-app:latest
  env_file: .env
  environment:
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: 3306
  volumes:
    - storage:/var/www/html/storage
  restart: unless-stopped
  networks:
    - codcompta

services:
  app:
    <<: *laravel
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      CONTAINER_ROLE: app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/codcompta-ready && SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  queue:
    <<: *laravel
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      CONTAINER_ROLE: queue
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=1", "--timeout=180", "--max-time=3600"]
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *laravel
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      CONTAINER_ROLE: scheduler
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    image: codcompta-web:latest
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - codcompta

  db:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks:
      - codcompta

volumes:
  storage:
  mysql-data:

networks:
  codcompta:
