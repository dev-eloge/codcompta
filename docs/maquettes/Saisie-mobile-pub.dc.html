<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Saisir la pub, téléphone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Sora:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F7F5;font-family:Manrope,system-ui,sans-serif;color:#0B2A33}
*{box-sizing:border-box}
h1,h2,h3,.sora{font-family:Sora,system-ui,sans-serif}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
button,a{cursor:pointer}
a{color:#0F7A60}
.input{min-height:52px;border-radius:12px;border:1px solid #C9D7D1;background:#FFFFFF;padding:0 14px;font:600 17px Manrope,sans-serif;color:#0B2A33;width:100%}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:700}
.step{width:52px;height:52px;border:0;background:transparent;font:700 22px Manrope,sans-serif;color:#0B2A33}
.icon-btn{width:48px;height:48px;border-radius:12px;border:1px solid #E1EAE6;background:#FFFFFF;display:grid;place-items:center}
</style>
</helmet>
<div style="width: 390px; min-height: 100vh; position: relative; padding-bottom: 120px">

<header style="background: #FFFFFF; border-bottom: 1px solid #E1EAE6; padding: 8px 8px 14px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 6px">
<button class="icon-btn" aria-label="Quitter la saisie" style="border: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B2A33" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<h1 style="margin: 0; font-size: 19px">Nouveau rapport</h1>
<span style="margin-left: auto; padding-right: 8px; font-size: 14px; font-weight: 700; color: #4A5E63">Étape 3 sur 4</span>
</div>
<ol aria-label="Étapes" style="margin: 0; padding: 0 8px; list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<li style="display: flex; flex-direction: column; gap: 6px"><span aria-hidden="true" style="height: 4px; border-radius: 99px; background: #0F7A60"></span><span style="font-size: 12px; font-weight: 700; color: #0B5E4A">Agence</span></li>
<li style="display: flex; flex-direction: column; gap: 6px"><span aria-hidden="true" style="height: 4px; border-radius: 99px; background: #0F7A60"></span><span style="font-size: 12px; font-weight: 700; color: #0B5E4A">Produits</span></li>
<li aria-current="step" style="display: flex; flex-direction: column; gap: 6px"><span aria-hidden="true" style="height: 4px; border-radius: 99px; background: #0F7A60"></span><span style="font-size: 12px; font-weight: 700; color: #0B2A33">Pub</span></li>
<li style="display: flex; flex-direction: column; gap: 6px"><span aria-hidden="true" style="height: 4px; border-radius: 99px; background: #DCE6E2"></span><span style="font-size: 12px; font-weight: 600; color: #4A5E63">Frais</span></li>
</ol>
</header>

<main style="padding: 16px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 2px 0 0; font-size: 22px">La pub du jour</h2>
<p style="margin: -6px 0 0; font-size: 15px; color: #33505A">Ce que vous avez payé aujourd'hui pour ces produits.</p>

<section aria-labelledby="mp1" style="background: #FFFFFF; border: 2px solid #0F7A60; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<h3 id="mp1" style="margin: 0; font-family: Manrope, sans-serif; font-size: 16px; font-weight: 700">Produit 1</h3>
<fieldset style="margin: 0; padding: 0; border: 0">
<legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 700">Où tourne la pub ?</legend>
<div role="radiogroup" aria-label="Où tourne la pub" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
<button role="radio" aria-checked="false" style="min-height: 48px; padding: 0 14px; border-radius: 12px; font: 600 15px Manrope,sans-serif; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid #C9D7D1; background: #FFFFFF; color: #33505A">Facebook</button>
<button role="radio" aria-checked="false" style="min-height: 48px; padding: 0 14px; border-radius: 12px; font: 600 15px Manrope,sans-serif; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid #C9D7D1; background: #FFFFFF; color: #33505A">TikTok</button>
<button role="radio" aria-checked="true" style="min-height: 48px; padding: 0 14px; border-radius: 12px; font: 600 15px Manrope,sans-serif; display: flex; align-items: center; justify-content: center; gap: 6px; border: 2px solid #0F7A60; background: #DDF2EA; color: #0B5E4A; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Les deux</button>
<button role="radio" aria-checked="false" style="min-height: 48px; padding: 0 14px; border-radius: 12px; font: 600 15px Manrope,sans-serif; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid #C9D7D1; background: #FFFFFF; color: #33505A">Pas de pub</button>
</div>
</fieldset>
<div class="field"><label for="mfb">Dépensé sur Facebook (F)</label><input id="mfb" class="input num" inputmode="numeric" value="6 000"></div>
<div class="field"><label for="mtt">Dépensé sur TikTok (F)</label><input id="mtt" class="input num" inputmode="numeric" value="4 500"></div>
<div class="field"><label for="mco">Commandes reçues <span style="font-weight: 500; color: #4A5E63">(facultatif)</span></label><input id="mco" class="input num" inputmode="numeric" value="14"></div>
<button style="min-height: 48px; border-radius: 12px; border: 1px solid #D5E1DC; background: #FFFFFF; font: 700 15px Manrope,sans-serif; color: #0B2A33">Valider la pub de ce produit</button>
</section>

<button style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; text-align: left; background: #FFFFFF; border: 1px solid #E1EAE6; border-radius: 16px; padding: 10px 14px; font: inherit; color: inherit">
<span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 99px; background: #E3EFF7; display: grid; place-items: center; flex: 0 0 auto"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1D4E6B" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg></span>
<span style="flex: 1"><strong style="display: block; font-size: 15px">Produit 4</strong><span class="num" style="font-size: 14px; color: #4A5E63">Même pub qu'Agence 2, 3 000 F</span></span>
<span style="font-size: 14px; font-weight: 700; color: #0F7A60">Modifier</span>
</button>
</main>

<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #E1EAE6; padding: 12px 16px 20px; display: flex; align-items: center; gap: 12px">
<div style="flex: 1; min-width: 0"><p style="margin: 0; font-size: 13px; color: #4A5E63">Bénéfice du jour</p><p class="sora num" aria-live="polite" style="margin: 2px 0 0; font-size: 22px; font-weight: 700">20 000 F</p></div>
<button style="min-height: 52px; padding: 0 18px; border: 0; border-radius: 12px; background: #0F7A60; color: #FFFFFF; font: 700 16px Manrope,sans-serif; display: flex; align-items: center; gap: 8px">Suivant : les frais<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
