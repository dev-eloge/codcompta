<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0f8a6c" />
        <title>Pas de connexion | CODCompta</title>
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <style>
            :root { color-scheme: light dark; --bg: #f4f8f6; --ink: #0b2a33; --muted: #4b6670; --primary: #0f8a6c; --card: #ffffff; }
            @media (prefers-color-scheme: dark) { :root { --bg: #08161b; --ink: #e6f2ee; --muted: #9db8b0; --primary: #3cc79a; --card: #0f2a31; } }
            * { box-sizing: border-box; }
            body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
                font: 16px/1.6 Manrope, ui-sans-serif, system-ui, sans-serif; }
            main { max-width: 26rem; width: 100%; background: var(--card); border-radius: 24px; padding: 32px 24px; text-align: center;
                box-shadow: 0 10px 40px -12px rgb(11 42 51 / 0.2); }
            img { width: 56px; height: 56px; }
            h1 { font-size: 1.35rem; margin: 16px 0 8px; }
            p { color: var(--muted); margin: 0 0 24px; }
            button { min-height: 44px; padding: 0 24px; border: 0; border-radius: 999px; background: var(--primary); color: #fff;
                font: inherit; font-weight: 700; cursor: pointer; }
            button:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
        </style>
    </head>
    <body>
        <main>
            <img src="/icon-192.png" alt="" width="56" height="56" />
            <h1>Pas de connexion internet</h1>
            <p>CODCompta a besoin d'internet pour afficher vos chiffres à jour. Vérifiez vos données mobiles ou votre Wi-Fi, puis réessayez.</p>
            <button type="button" onclick="location.reload()">Réessayer</button>
        </main>
    </body>
</html>
