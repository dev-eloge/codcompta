# Reverse proxy on the VPS (the Nginx that already serves your other app).
# Copy to /etc/nginx/sites-available/, enable it, then run certbot (see DEPLOIEMENT.md).
# Certbot adds the "listen 443 ssl" part and the redirect from http to https by itself.

server {
    listen 80;
    listen [::]:80;
    server_name elogecompta.africodehub.net;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 120s;
    }
}
