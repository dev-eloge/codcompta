# Variant: use this one instead if the certificate already on the server covers *.africodehub.net
# (check with: sudo certbot certificates). Adjust the two ssl_certificate paths to that certificate.

server {
    listen 80;
    listen [::]:80;
    server_name elogecompta.africodehub.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name elogecompta.africodehub.net;

    ssl_certificate     /etc/letsencrypt/live/africodehub.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/africodehub.net/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 120s;
    }
}
